name: Release

# 推送形如 v1.0.0 的标签时触发：测试 → 交叉编译六平台产物 → 打包 → 创建 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: 单元测试与静态检查
        run: |
          go vet ./...
          go test ./...

      - name: 生成 Windows 图标资源
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -arch amd64 -ico assets/chpilot.ico -o rsrc_windows_amd64.syso
          rsrc -arch arm64 -ico assets/chpilot.ico -o rsrc_windows_arm64.syso

      - name: 交叉编译（6 平台产物）
        run: VERSION="${GITHUB_REF_NAME}" ./build.sh

      - name: 按平台打包并生成校验和
        run: |
          set -e
          cd dist
          for p in windows linux macos; do
            (cd "$p" && zip -r "../chpilot-${p}.zip" .)
          done
          sha256sum chpilot-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: CHPilot ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/chpilot-windows.zip
            dist/chpilot-linux.zip
            dist/chpilot-macos.zip
            dist/SHA256SUMS.txt
            dist/README.txt
