<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="CHPilot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形渐变底 -->
  <rect x="0" y="0" width="256" height="256" rx="59" ry="59" fill="url(#bg)"/>
  <!-- 拨动开关（白色胶囊） -->
