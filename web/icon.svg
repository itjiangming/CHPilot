  <!-- 胶囊内左侧引脚暗示 -->
  <rect x="70.2" y="116.5" width="20.5" height="6" rx="3" ry="3" fill="#93C5FD"/>
  <rect x="70.2" y="133.5" width="20.5" height="6" rx="3" ry="3" fill="#93C5FD"/>
  <!-- 蓝色圆钮（导通位） -->
  <circle cx="181" cy="128" r="22.3" fill="#2563EB"/>
